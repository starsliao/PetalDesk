name: Build desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate release versions
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v") -or $tag.Length -le 1) {
            throw "Release tag must use the vX.Y.Z form: $tag"
          }
          $expected = $tag.Substring(1)
          $cargo = Get-Content "src-tauri/Cargo.toml" -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $versions = [ordered]@{
            "package.json" = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
            "src-tauri/Cargo.toml" = $cargoVersion
            "src-tauri/tauri.conf.json" = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
            "browser-extension/package.json" = (Get-Content "browser-extension/package.json" -Raw | ConvertFrom-Json).version
            "browser-extension/manifest/chromium.json" = (Get-Content "browser-extension/manifest/chromium.json" -Raw | ConvertFrom-Json).version
            "browser-extension/manifest/firefox.json" = (Get-Content "browser-extension/manifest/firefox.json" -Raw | ConvertFrom-Json).version
          }
          foreach ($entry in $versions.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value) -or $entry.Value -ne $expected) {
              throw "$($entry.Key) version '$($entry.Value)' does not match tag '$tag'."
            }
          }
          Write-Host "All release versions match $tag."

      - name: Test updater manifest tooling
        shell: pwsh
        run: '& "./scripts/test-windows-updater-manifest.ps1"'

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed Windows installer
        shell: pwsh
        env:
          PETALDESK_CHROME_EXTENSION_ID: ${{ secrets.PETALDESK_CHROME_EXTENSION_ID }}
          PETALDESK_EDGE_EXTENSION_ID: ${{ secrets.PETALDESK_EDGE_EXTENSION_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "scripts\build-windows-installer.ps1" -RequireUpdaterSignature
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer build failed with exit code $LASTEXITCODE."
          }

      - name: Build Firefox extension package
        shell: pwsh
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          $signArguments = @()
          $hasIssuer = -not [string]::IsNullOrWhiteSpace($env:AMO_JWT_ISSUER)
          $hasSecret = -not [string]::IsNullOrWhiteSpace($env:AMO_JWT_SECRET)
          if ($hasIssuer -ne $hasSecret) {
            throw "Configure both AMO_JWT_ISSUER and AMO_JWT_SECRET, or neither."
          }
          if ($hasIssuer) {
            $signArguments += "-Sign"
          }
          & ".\browser-extension\scripts\package-firefox.ps1" @signArguments

      - name: Collect Windows release assets
        shell: pwsh
        run: |
          $assetsDirectory = New-Item -ItemType Directory -Path "release-assets" -Force
          $installers = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "PetalDesk_*_x64-setup.exe" -File |
            Where-Object { $_.Name.EndsWith(".exe", [System.StringComparison]::OrdinalIgnoreCase) })
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)."
          }
          Copy-Item -LiteralPath $installers[0].FullName -Destination $assetsDirectory.FullName

          $updaterSignature = Get-Item -LiteralPath "$($installers[0].FullName).sig" -ErrorAction Stop
          if ($updaterSignature.Length -eq 0) {
            throw "Windows updater signature is empty: $($updaterSignature.FullName)"
          }
          Copy-Item -LiteralPath $updaterSignature.FullName -Destination $assetsDirectory.FullName

          $firefoxArchives = @(Get-ChildItem -Path "browser-extension/dist/artifacts" -Filter "PetalDesk_Firefox_AMO-upload_*.zip" -File)
          if ($firefoxArchives.Count -ne 1) {
            throw "Expected one Firefox AMO upload archive, found $($firefoxArchives.Count)."
          }
          Copy-Item -LiteralPath $firefoxArchives[0].FullName -Destination $assetsDirectory.FullName

          $signedFirefoxPackages = @(Get-ChildItem -Path "browser-extension/dist/signed" -Filter "PetalDesk_Firefox_*-signed.xpi" -File -ErrorAction SilentlyContinue)
          if ($signedFirefoxPackages.Count -gt 1) {
            throw "Expected at most one signed Firefox XPI, found $($signedFirefoxPackages.Count)."
          }
          if ($signedFirefoxPackages.Count -eq 1) {
            Copy-Item -LiteralPath $signedFirefoxPackages[0].FullName -Destination $assetsDirectory.FullName
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets/*
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: universal-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Universal macOS DMG
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          certificate_values=("$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY")
          certificate_count=0
          for value in "${certificate_values[@]}"; do
            [[ -n "$value" ]] && certificate_count=$((certificate_count + 1))
          done
          if [[ "$certificate_count" -ne 0 && "$certificate_count" -ne 3 ]]; then
            echo "Configure APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY together." >&2
            exit 1
          fi

          notarization_values=("$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID")
          notarization_count=0
          for value in "${notarization_values[@]}"; do
            [[ -n "$value" ]] && notarization_count=$((notarization_count + 1))
          done
          if [[ "$notarization_count" -ne 0 && "$notarization_count" -ne 3 ]]; then
            echo "Configure APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID together." >&2
            exit 1
          fi
          if [[ "$notarization_count" -ne "$certificate_count" ]]; then
            echo "Configure all six Apple signing and notarization secrets together, or leave all of them empty." >&2
            exit 1
          fi
          if [[ "$certificate_count" -eq 0 ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          fi
          if [[ "$notarization_count" -eq 0 ]]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          pnpm package:macos

      - name: Collect macOS release asset
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          source_directory="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          shopt -s nullglob
          images=("$source_directory"/*.dmg)
          if [[ "${#images[@]}" -ne 1 ]]; then
            echo "Expected one Universal macOS DMG, found ${#images[@]}." >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "${images[0]}" "release-assets/PetalDesk_${version}_universal.dmg"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release-assets'
          path: release-assets
          merge-multiple: true

      - name: Prepare draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"

          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $tag is already published. Published releases are immutable; create a new version instead of replacing updater assets." >&2
              exit 1
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "飞花 - PetalDesk $version" --generate-notes
          fi

          gh release view "$tag" --json body --jq '.body // ""' > release-notes.md

      - name: Generate and validate Windows updater manifest
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)
          $installers = @(Get-ChildItem -LiteralPath "release-assets" -Filter "PetalDesk_*_x64-setup.exe" -File |
            Where-Object { $_.Name.EndsWith(".exe", [System.StringComparison]::OrdinalIgnoreCase) })
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)."
          }
          $signaturePath = "$($installers[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "Missing Windows updater signature: $signaturePath"
          }

          & "./scripts/New-WindowsUpdaterManifest.ps1" `
            -Version $version `
            -InstallerPath $installers[0].FullName `
            -SignaturePath $signaturePath `
            -Repository "${{ github.repository }}" `
            -Tag $tag `
            -NotesPath "release-notes.md" `
            -OutputPath "release-assets/latest.json"

          & "./scripts/Test-WindowsUpdaterManifest.ps1" `
            -Version $version `
            -ManifestPath "release-assets/latest.json" `
            -InstallerPath $installers[0].FullName `
            -SignaturePath $signaturePath `
            -Repository "${{ github.repository }}" `
            -Tag $tag

      - name: Upload signed assets and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          shopt -s nullglob

          windows_installers=(release-assets/PetalDesk_*_x64-setup.exe)
          windows_signatures=(release-assets/PetalDesk_*_x64-setup.exe.sig)
          macos_images=(release-assets/PetalDesk_*_universal.dmg)
          firefox_archives=(release-assets/PetalDesk_Firefox_AMO-upload_*.zip)
          if [[ "${#windows_installers[@]}" -ne 1 || "${#windows_signatures[@]}" -ne 1 ]]; then
            echo "Expected exactly one signed Windows updater payload." >&2
            exit 1
          fi
          if [[ "${#macos_images[@]}" -ne 1 || "${#firefox_archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one macOS DMG and one Firefox archive." >&2
            exit 1
          fi
          if [[ ! -s release-assets/latest.json ]]; then
            echo "Missing Windows updater manifest: release-assets/latest.json" >&2
            exit 1
          fi

          # Keep the release as a draft while uploading. Upload latest.json last,
          # then publish once every payload and signature is already available.
          mapfile -t payload_assets < <(find release-assets -maxdepth 1 -type f ! -name latest.json | sort)
          gh release upload "$tag" "${payload_assets[@]}" --clobber
          gh release upload "$tag" release-assets/latest.json --clobber
          gh release edit "$tag" --draft=false --latest

      - name: Verify public updater assets
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          installer_name="PetalDesk_${version}_x64-setup.exe"
          latest_url="https://github.com/${GH_REPO}/releases/latest/download/latest.json"

          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors \
            "$latest_url" --output remote-latest.json
          jq -e --arg version "$version" \
            '.version == $version and (.platforms | keys == ["windows-x86_64"])' \
            remote-latest.json >/dev/null

          expected_url="https://github.com/${GH_REPO}/releases/download/${tag}/${installer_name}"
          jq -e --arg url "$expected_url" \
            '.platforms["windows-x86_64"].url == $url and (.platforms["windows-x86_64"].signature | length > 0)' \
            remote-latest.json >/dev/null

          for asset in "$installer_name" "${installer_name}.sig" latest.json; do
            curl --fail --silent --show-error --location --head --retry 12 --retry-delay 5 --retry-all-errors \
              "https://github.com/${GH_REPO}/releases/download/${tag}/${asset}" >/dev/null
          done
