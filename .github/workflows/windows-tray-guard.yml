name: Windows Tray Guard

on:
  pull_request:
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/vendor/tao/**"
      - "src-tauri/vendor/tray-icon/**"
      - "scripts/test-tray-icon-windows-patch.ps1"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-tray-guard.yml"
  push:
    branches:
      - main
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/vendor/tao/**"
      - "src-tauri/vendor/tray-icon/**"
      - "scripts/test-tray-icon-windows-patch.ps1"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-tray-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tray-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 守卫脚本会 cargo check 整个 petaldesk crate，而 generate_context!
      # 要求 frontendDist(../build)存在，因此这里必须先构建前端。
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for the tray guard integration check
        run: pnpm build

      - name: Test Windows tray and taskbar deadlock guards
        shell: pwsh
        run: '& "./scripts/test-tray-icon-windows-patch.ps1"'
