<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PetalDesk password-change fixture</title>
    <style>
      body { max-width: 28rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; color: #17202a; }
      form, label { display: grid; gap: 0.65rem; }
      input, button { min-height: 2.5rem; padding: 0.5rem; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>Change password</h1>
      <form id="change-form">
        <label>Email <input name="username" type="email" autocomplete="username" required></label>
        <label>Current password <input name="currentPassword" type="password" autocomplete="current-password" required></label>
        <label>New password <input name="newPassword" type="password" autocomplete="new-password" required></label>
        <label>Confirm new password <input name="confirmPassword" type="password" autocomplete="new-password" required></label>
        <button type="submit">Change password</button>
      </form>
      <p>Use dummy values only. This form performs no network request.</p>
    </main>
    <script>
      document.querySelector("#change-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const status = document.createElement("p");
        status.textContent = "Fixture password changed.";
        event.currentTarget.replaceWith(status);
      });
    </script>
  </body>
</html>
